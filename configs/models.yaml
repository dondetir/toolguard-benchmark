models:
  # TMLR revision — reviewer-requested stronger 3B–4B models (Reviewer 9CRP)
  - name: qwen3:4b-instruct        # = Qwen3-4B-Instruct-2507 (non-reasoning instruct)
    provider: ollama
    tool_format: json              # native ollama tool_calls
    max_tokens: 2048
    think: false
  - name: qwen3.5:4b               # = Qwen/Qwen3.5-4B, reasoning disabled for tool-calling latency
    provider: ollama
    tool_format: json
    max_tokens: 2048
    think: false
  - name: gemma3:4b                # = google/gemma-3-4b-it; no native ollama tool API → prompted tools
    provider: ollama
    tool_format: prompted
    max_tokens: 2048

  # Baselines (evaluated in the original submission)
  - name: smollm2:1.7b
    provider: ollama
    tool_format: json
    max_tokens: 2048
  - name: llama3.2:1b        # base/instruct clarification: ollama's llama3.2 tags are the instruct tunes
    provider: ollama
    tool_format: json
    max_tokens: 2048
  - name: llama3.2:3b        # = meta-llama/Llama-3.2-3B-Instruct (ollama default 3b = instruct)
    provider: ollama
    tool_format: json
    max_tokens: 2048
  - name: qwen2.5:3b
    provider: ollama
    tool_format: json
    max_tokens: 2048
  # TMLR revision (jiww): within-family size gradient below 3B (0.5B / 1.5B / 3B),
  # all native-tool qwen2.5 so size is isolated from architecture.
  - name: qwen2.5:0.5b
    provider: ollama
    tool_format: json
    max_tokens: 2048
  - name: qwen2.5:1.5b
    provider: ollama
    tool_format: json
    max_tokens: 2048
